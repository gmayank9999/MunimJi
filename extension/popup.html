<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MunimJi Lens</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 340px; margin: 0; padding: 12px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0a0b0f; color: #e6e8ef; font-size: 13px;
    }
    h1 { font-size: 14px; margin: 0 0 10px; color: #ff8a1f; }
    .muted { color: #8b90a3; }
    .card {
      border: 1px solid #232633; background: #12141b; border-radius: 8px;
      padding: 10px; margin-bottom: 8px;
    }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .subject { font-weight: 600; margin: 4px 0; }
    .body { color: #cbd0dc; max-height: 60px; overflow: hidden; font-size: 12px; }
    button {
      border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px;
      font-weight: 600; cursor: pointer;
    }
    .approve { background: #22c55e; color: #06110a; }
    .reject { background: transparent; border: 1px solid #232633; color: #8b90a3; }
    .actions { display: flex; gap: 6px; margin-top: 8px; }
    #options-link { color: #8b90a3; font-size: 11px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🪔 MunimJi Lens</h1>
  <div id="content" class="muted">Loading…</div>
  <div style="margin-top: 10px; text-align: right;">
    <a id="options-link" href="#">Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
