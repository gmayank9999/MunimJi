# 18 demo invoices. Section 18.2 of IMPLEMENTATION_PLAN.md. Dates are offsets in days
# from "D" (seeding day, i.e. today when seed_stripe.py runs) - negative = in the past.
# due_offset_days is what actually drives the policy engine (days_overdue); the other
# fields are metadata for Notion / future Gmail thread seeding, not re-derived from Stripe.

