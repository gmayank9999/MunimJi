# logical: { id: <verified canonical id>, risk: read|write|send|blocked, setup_only: bool }
# All ids verified against the live Swytchcode registry via `swy info` (2026-09-25).
# Do not hand-edit an id without re-verifying with `swy info <id>` first.

# PayPal was replaced with Stripe: `swy auth connect PayPal` is broken on Swytchcode's
# side (its OAuth broker's own client_id is rejected by PayPal), confirmed a Swytchcode
# plan limit by their own team. Stripe uses simple api_key auth and works. See
# docs/swytchcode-notes.md for the full story.
stripe.invoices.list:      { id: "stripe.invoice.list", risk: read }
stripe.invoices.get:       { id: "stripe.invoice.get", risk: read }
stripe.invoices.create:    { id: "stripe.invoice.create", risk: write, setup_only: true }
stripe.invoices.finalize:  { id: "stripe.finalize.create", risk: write, setup_only: true }
stripe.invoices.send:      { id: "stripe.send.create", risk: send }
stripe.invoices.pay:       { id: "stripe.pay.create", risk: write, setup_only: true }
stripe.invoices.void:      { id: "stripe.void.create1", risk: blocked }
stripe.disputes.list:      { id: "stripe.dispute.list", risk: read }
stripe.charges.refund:     { id: "stripe.refund.create3", risk: send }

