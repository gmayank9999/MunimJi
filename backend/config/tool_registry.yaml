# Notion's current API models a "database" as a data source; notion.db.* names are
# kept for readability even though the verified canonical ids say "data_source"/"query".
notion.db.create:           { id: "notion.data_source.create", risk: write, setup_only: true }
notion.db.query:            { id: "notion.query.create", risk: read }
notion.page.create:         { id: "notion.page.create", risk: write }
notion.page.update:         { id: "notion.page.update", risk: write }
notion.blocks.append:       { id: "notion.children.update", risk: write }
